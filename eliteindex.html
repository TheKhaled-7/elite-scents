<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Elite Scents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="glow"></div>

    <header>
        <div class="logo">
            Elite Scents
            <span class="hover-text">Luxury fragrances that define your identity</span>
        </div>

        <div class="cart-btn" onclick="toggleCart()">Cart</div>
    </header>

    <section class="hero">
        <div>
            <h1>Elite Scents</h1>
            <p>Luxury fragrances that define your identity.</p>
        </div>
    </section>

    <section class="products">

        <div class="card">
            <h3>Cardamom Essence</h3>
            <p>Warm spicy luxury blend</p>
            <button onclick="addToCart(0)">Add to Cart</button>
        </div>

        <div class="card">
            <h3>Oud Resin Blend</h3>
            <p>Deep woody signature scent</p>
            <button onclick="addToCart(1)">Add to Cart</button>
        </div>

        <div class="card">
            <h3>Rose Garden</h3>
            <p>Soft floral elegant fragrance</p>
            <button onclick="addToCart(2)">Add to Cart</button>
        </div>

    </section>

    <!-- CART (FIXED STRUCTURE) -->
    <div class="cart" id="cart">
        <h2>Your Cart</h2>

        <div id="cartItems"></div>

        <div class="total" id="totalPrice"></div>
        <button onclick="checkoutWhatsApp()">
            Checkout
        </button>

        <button onclick="toggleCart()">Close</button>
    </div>

    <a class="whatsapp" href="https://wa.me/201234567890" target="_blank"></a>

    <script src="script.js"></script>

</body>
